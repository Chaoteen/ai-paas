[run]
source = models,tests
branch = True
omit = 
    */__pycache__/*
    */.venv/*
    */tests/fixtures/*
    */alembic/*

[report]
exclude_lines =
    pragma: no cover
    def __repr__
    if TYPE_CHECKING:
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
    \.\.\.

precision = 2
show_missing = True
skip_covered = False

[html]
directory = htmlcov
title = AI-PaaS Coverage Report

[xml]
output = coverage.xml